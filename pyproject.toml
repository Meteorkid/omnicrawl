[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnicrawl"
version = "0.1.0"
description = "无所不能的爬虫框架 — 整合 Scrapling + curl_cffi + Playwright，绕过 WAF，LLM 友好输出"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "curl_cffi>=0.15",
    "scrapling>=0.3",
    "playwright>=1.40",
    "patchright>=1.40",
    "selectolax>=0.3",
    "markdownify>=0.11",
    "tiktoken>=0.5",
    "browserforge>=1.0",
    "msgspec>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
# omnicrawl = "omnicrawl.cli:main"  # TODO: 实现 CLI 后启用
